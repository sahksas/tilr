<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile Animation Viewer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0a1a;
        color: #eee;
        overflow: hidden;
      }

      #canvas-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        width: 100vw;
        max-width: 800px;
        height: auto;
        max-height: 100vh;
        display: block;
      }

      /* 右下のコントロール */
      #controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 100;
      }

      .control-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        background: rgba(74, 74, 138, 0.8);
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        backdrop-filter: blur(4px);
      }

      .control-btn:hover {
        background: rgba(90, 90, 154, 0.9);
        transform: scale(1.05);
      }

      .control-btn:disabled {
        background: rgba(51, 51, 51, 0.8);
        cursor: not-allowed;
      }

      /* メニューポップアップ */
      #menu-popup {
        position: fixed;
        bottom: 80px;
        right: 20px;
        background: rgba(30, 30, 50, 0.95);
        border-radius: 12px;
        padding: 20px;
        min-width: 280px;
        z-index: 200;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: none;
      }

      #menu-popup.visible {
        display: block;
      }

      #menu-popup h3 {
        font-size: 0.9rem;
        color: #888;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .setting-row label {
        font-size: 0.9rem;
        color: #ccc;
      }

      .setting-row input[type="number"] {
        width: 70px;
        padding: 6px 10px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #222;
        color: #fff;
        font-size: 0.9rem;
      }

      .setting-row input[type="color"] {
        width: 50px;
        height: 32px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
      }

      .setting-row input[type="range"] {
        width: 120px;
        cursor: pointer;
      }

      #status {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #333;
        font-size: 0.8rem;
        color: #888;
        line-height: 1.4;
      }

      /* シークバー（画面下部中央） */
      #seekbar-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }

      #seekbar-container.visible {
        display: block;
      }

      #seekbar {
        width: 300px;
        cursor: pointer;
        accent-color: #4a4a8a;
      }

      #frame-info {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        z-index: 100;
        display: none;
      }

      #frame-info.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <div id="frame-info">Frame: 0 / 0</div>
    <div id="seekbar-container">
      <input type="range" id="seekbar" min="0" max="100" value="0" />
    </div>

    <div id="controls">
      <button id="play-btn" class="control-btn" disabled title="Play/Pause">▶</button>
      <button id="menu-btn" class="control-btn" title="Settings">⚙</button>
    </div>

    <div id="menu-popup">
      <h3>Settings</h3>
      <div class="setting-row">
        <label for="tile-size">Density</label>
        <input type="number" id="tile-size" value="8" min="1" max="32" />
      </div>
      <div class="setting-row">
        <label for="tile-color">Color</label>
        <input type="color" id="tile-color" value="#4a9eff" />
      </div>
      <div class="setting-row">
        <label for="bg-color">Background</label>
        <input type="color" id="bg-color" value="#0a0a1a" />
      </div>
      <div class="setting-row">
        <label for="fps-input">FPS</label>
        <input type="number" id="fps-input" value="15" min="1" max="60" />
      </div>
      <div id="status">Loading...</div>
    </div>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
